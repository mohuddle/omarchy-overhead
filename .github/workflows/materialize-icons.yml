name: Materialize branding icons
on:
  push:
    paths:
      - "branding/**/*.svg"
      - "branding/android/ic_launcher.xml"
      - "scripts/materialize_icons.py"
      - ".github/workflows/materialize-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install render deps
        run: pip install cairosvg pillow
      - name: Render PNGs from Mobitecture SVGs
        run: python3 scripts/materialize_icons.py
      - name: Commit materialized PNGs
        run: |
          git config user.name "Mobitecture"
          git config user.email "18602380+mohuddle@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Materialize Mobitecture PNG launcher icons"
          git push
